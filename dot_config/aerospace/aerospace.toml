# ~/.aerospace.toml
config-version = 2
start-at-login = true

# Run Sketchybar together with AeroSpace
# sketchybar has a built-in detection of already running process,
# so it won't be run twice on AeroSpace restart
after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Optional: if you like mouse following focus between monitors
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 40  # Space for Sketchybar (32px) + padding. On laptop, menu bar already reserves space so this adds extra margin
outer.bottom = 8

# --- MONITOR ASSIGNMENTS ------------------------------------------------------
# Monitor sequence numbers are left-to-right, 1-based.
# Adjust if your left/center/right monitors are not 1/2/3.
[workspace-to-monitor-force-assignment]
"1-web" = 1
"1-dev" = 2
"1-chat" = 3

"2-web" = 1
"2-dev" = 2
"2-chat" = 3

"3-web" = 1
"3-dev" = 2
"3-chat" = 3

"4-web" = 1
"4-dev" = 2
"4-chat" = 3

"5-web" = 1
"5-dev" = 2
"5-chat" = 3


# --- APP → WORKSPACE RULES ----------------------------------------------------
# You can discover app bundle IDs via: `aerospace list-apps` or `mdls ...`.

# Chrome -> left (coding set)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1-web'

# Cursor -> center (coding set)
# (Cursor's bundle id can vary; name-match is often more robust. You can replace with if.app-id once confirmed.)
[[on-window-detected]]
if.app-name-regex-substring = 'cursor'
run = 'move-node-to-workspace 1-dev'

# Slack -> right (coding set)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1-chat'


# --- KEYBINDINGS --------------------------------------------------------------
[mode.main.binding]
# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'  # i3-style float toggle

# Focus windows (vim keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows within workspace tree
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Focus monitor (3-monitor friendly)
alt-ctrl-h = 'focus-monitor --wrap-around left'
alt-ctrl-l = 'focus-monitor --wrap-around right'
alt-ctrl-j = 'focus-monitor --wrap-around down'
alt-ctrl-k = 'focus-monitor --wrap-around up'  # focus-monitor supports directions/next/prev/patterns

# Move focused window to another monitor (and follow it)
alt-ctrl-shift-h = 'move-node-to-monitor --wrap-around --focus-follows-window left'
alt-ctrl-shift-l = 'move-node-to-monitor --wrap-around --focus-follows-window right'
alt-ctrl-shift-j = 'move-node-to-monitor --wrap-around --focus-follows-window down'
alt-ctrl-shift-k = 'move-node-to-monitor --wrap-around --focus-follows-window up'

# Switch workspace SET (left + center monitors only)
# Right monitor stays on 1-chat (Slack is sticky there)
alt-1 = ['workspace 1-web', 'workspace 1-dev']
alt-2 = ['workspace 2-web', 'workspace 2-dev']
alt-3 = ['workspace 3-web', 'workspace 3-dev']
alt-4 = ['workspace 4-web', 'workspace 4-dev']
alt-5 = ['workspace 5-web', 'workspace 5-dev']

# Move window to workspace (use ctrl+alt+number)
ctrl-alt-1 = 'move-node-to-workspace 1-dev'
ctrl-alt-2 = 'move-node-to-workspace 2-dev'
ctrl-alt-3 = 'move-node-to-workspace 3-dev'
ctrl-alt-4 = 'move-node-to-workspace 4-dev'
ctrl-alt-5 = 'move-node-to-workspace 5-dev'

# Add your own custom bindings below:
# alt-w = 'workspace ...'
# alt-e = 'workspace ...'
# alt-s = 'workspace ...'

# Back-and-forth
alt-tab = 'workspace-back-and-forth'

# Fullscreen (AeroSpace fullscreen, not macOS native fullscreen)
alt-f = 'fullscreen'

# Reset/cleanup helpers
alt-b = 'balance-sizes'
alt-shift-b = 'flatten-workspace-tree'

# Modes
alt-r = 'mode resize'
alt-space = 'mode launch'
alt-shift-semicolon = 'mode service'

# Optional close (macOS cmd+w also works)
alt-q = 'close'

# Show cheatsheet (Alt + ?) - opens with glow in pager mode (install: brew install glow)
# Press q to exit the preview
alt-shift-slash = 'exec-and-forget alacritty -e glow -p ~/.config/aerospace/README.md'


# --- RESIZE MODE --------------------------------------------------------------
[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
shift-h = 'resize width -100'
shift-l = 'resize width +100'
shift-j = 'resize height +100'
shift-k = 'resize height -100'
esc = 'mode main'
enter = 'mode main'  # resize supports width/height/smart, etc.


# --- LAUNCH MODE --------------------------------------------------------------
# A simple "app launcher" that also jumps you to the right workspace.
# exec-and-forget runs a bash snippet (config-only)
[mode.launch.binding]
b = ['workspace 1-web',  'exec-and-forget open -a "Google Chrome"', 'mode main']
c = ['workspace 1-dev',  'exec-and-forget open -a "Cursor"',       'mode main']
s = ['workspace 1-chat', 'exec-and-forget open -a "Slack"',        'mode main']
t = ['workspace 1-dev',  'exec-and-forget open -a "Alacritty"',    'mode main']
esc = 'mode main'
enter = 'mode main'


# --- SERVICE MODE -------------------------------------------------------------
[mode.service.binding]
r = ['reload-config', 'mode main']
t = ['enable toggle', 'mode main']   # temporarily disable/enable tiling
esc = 'mode main'
enter = 'mode main'
