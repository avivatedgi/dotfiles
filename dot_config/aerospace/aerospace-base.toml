# AeroSpace base config — profile-specific sections injected by generate-config.sh
# Edit this file (and profiles/) instead of aerospace.toml directly.
config-version = 2
start-at-login = true

after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
    'exec-and-forget ~/.config/aerospace/generate-config.sh',
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.bottom = 8
outer.top = [{ monitor."built-in" = 8 }, 40]

# --- MONITOR ASSIGNMENTS (injected from profiles/) -------------------------
# @MONITORS@


# --- APP → WORKSPACE RULES ------------------------------------------------
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1-web'

[[on-window-detected]]
if.app-name-regex-substring = 'cursor'
run = 'move-node-to-workspace 1-dev'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1-chat'


# --- KEYBINDINGS ----------------------------------------------------------
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'

alt-h = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
alt-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
alt-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
alt-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'move-node-to-monitor --wrap-around --focus-follows-window left'
alt-ctrl-l = 'move-node-to-monitor --wrap-around --focus-follows-window right'
alt-ctrl-j = 'move-node-to-monitor --wrap-around --focus-follows-window down'
alt-ctrl-k = 'move-node-to-monitor --wrap-around --focus-follows-window up'

# --- WORKSPACE SWITCHING (injected from profiles/) ------------------------
# @WORKSPACE_BINDINGS@

ctrl-alt-1 = 'move-node-to-workspace 1-dev'
ctrl-alt-2 = 'move-node-to-workspace 2-dev'
ctrl-alt-3 = 'move-node-to-workspace 3-dev'
ctrl-alt-4 = 'move-node-to-workspace 4-dev'
ctrl-alt-5 = 'move-node-to-workspace 5-dev'

# Reserved for tmux (not bound in AeroSpace, passes through to terminal):
# alt-e = tmux split horizontal (side by side)
# alt-shift-e = tmux split vertical (stacked)
# alt-o = tmux sesh session picker
# alt-w = tmux close pane
# alt-arrows = tmux navigate between panes

alt-tab = 'workspace-back-and-forth'
alt-f = 'fullscreen'
alt-b = 'balance-sizes'
alt-shift-b = 'flatten-workspace-tree'
alt-r = 'mode resize'
alt-space = 'mode launch'
alt-shift-semicolon = 'mode service'
alt-q = 'close'

alt-shift-slash = 'exec-and-forget alacritty -e glow -p ~/.config/aerospace/README.md'


# --- RESIZE MODE ----------------------------------------------------------
[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
shift-h = 'resize width -100'
shift-l = 'resize width +100'
shift-j = 'resize height +100'
shift-k = 'resize height -100'
esc = 'mode main'
enter = 'mode main'


# --- LAUNCH MODE ----------------------------------------------------------
[mode.launch.binding]
b = ['workspace 1-web', 'exec-and-forget open -a "Google Chrome"', 'mode main']
c = ['workspace 1-dev', 'exec-and-forget open -a "Cursor"', 'mode main']
s = ['workspace 1-chat', 'exec-and-forget open -a "Slack"', 'mode main']
t = ['workspace 1-dev', 'exec-and-forget open -a "Alacritty"', 'mode main']
esc = 'mode main'
enter = 'mode main'


# --- SERVICE MODE ---------------------------------------------------------
[mode.service.binding]
r = ['reload-config', 'mode main']
t = ['enable toggle', 'mode main']
esc = 'mode main'
enter = 'mode main'
